<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>填表助手测试页</title>
  <style>
    body { font-family: sans-serif; padding: 24px; background: #f9fafb; }
    .form { max-width: 800px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; }
    .row { display: flex; gap: 16px; margin-bottom: 12px; }
    .field { flex: 1; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #374151; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; }
    button { padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    #result { margin-top: 16px; padding: 12px; background: #eff6ff; border-radius: 6px; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="form">
    <h2>夏令营报名信息（模拟）</h2>
    <div class="row">
      <div class="field"><label>姓名</label><input type="text" id="name" /></div>
      <div class="field"><label>性别</label><select id="gender"><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select></div>
      <div class="field"><label>出生日期</label><input type="date" id="birth" /></div>
    </div>
    <div class="row">
      <div class="field"><label>身份证号</label><input type="text" id="idcard" /></div>
      <div class="field"><label>手机号码</label><input type="text" id="phone" /></div>
      <div class="field"><label>电子邮箱</label><input type="email" id="email" /></div>
    </div>
    <div class="row">
      <div class="field"><label>本科学校</label><input type="text" id="school" /></div>
      <div class="field"><label>所在学院</label><input type="text" id="department" /></div>
      <div class="field"><label>专业名称</label><input type="text" id="major" /></div>
    </div>
    <div class="row">
      <div class="field"><label>专业排名</label><input type="text" id="rank" /></div>
      <div class="field"><label>绩点</label><input type="text" id="gpa" /></div>
      <div class="field"><label>拟获学位</label><input type="text" id="degree" /></div>
    </div>
    <div class="row">
      <div class="field"><label>英语四级</label><input type="text" id="cet4" /></div>
      <div class="field"><label>英语六级</label><input type="text" id="cet6" /></div>
    </div>
    <div class="row">
      <div class="field"><label>个人陈述</label><textarea id="statement" rows="4"></textarea></div>
      <div class="field"><label>获奖情况</label><textarea id="awards" rows="4"></textarea></div>
    </div>
    <button id="fill">测试一键填表</button>
    <div id="result"></div>
  </div>

  <script src="../src/content/utils.js"></script>
  <script src="../src/content/form-finder.js"></script>
  <script src="../src/content/field-matcher.js"></script>
  <script src="../src/content/adapters/index.js"></script>
  <script src="../src/content/adapters/generic.js"></script>
  <script src="../src/content/adapters/chsi.js"></script>
  <script src="../src/content/adapter.js"></script>
  <script src="test.js"></script>
</body>
</html>
